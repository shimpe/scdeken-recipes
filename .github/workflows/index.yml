name: Index

# Builds the package index, signs it, publishes it on GitHub Pages and lets the
# tag bot propose new upstream versions. Only the sign job can use the signing
# key: it lives in the "release" environment, which is restricted to the main
# branch.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['advisories/**']

permissions:
  contents: read

concurrency:
  group: index
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build the index
    runs-on: ubuntu-22.04
    # This job reads untrusted upstream repositories, so it has no access to
    # the release environment and no signing secrets.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install scdeken
        run: |
          go install "github.com/shimpe/scdeken/cmd/scdeken@$(cat .scdeken-version)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASES_REPO: ${{ github.repository }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir site
          scdeken index build \
            --recipes recipes \
            --advisories advisories \
            --sc-versions sc-versions.toml \
            --previous "$PAGES_BASE/index.json" \
            --releases-repo "$RELEASES_REPO" \
            --out site/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-index
          path: site/index.json

  sign:
    name: sign the index
    needs: build
    runs-on: ubuntu-22.04
    environment: release
    steps:
      # Only the repository's own scdeken version is built here; no upstream code runs.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install scdeken
        run: |
          go install "github.com/shimpe/scdeken/cmd/scdeken@$(cat .scdeken-version)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-index
          path: site
      - name: Sign the index
        env:
          SCDEKEN_SIGNING_KEY: ${{ secrets.SCDEKEN_SIGNING_KEY }}
          SCDEKEN_SIGNING_PASSWORD: ${{ secrets.SCDEKEN_SIGNING_PASSWORD }}
        run: scdeken index sign --in site/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: publish on GitHub Pages
    needs: sign
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  tag-bot:
    name: propose new upstream versions
    needs: deploy
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # BOT_TOKEN is optional. Pull requests opened with the default token
          # do not start the PR build workflow; a token from a bot account or
          # a fine-grained PAT does.
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install scdeken
        run: |
          go install "github.com/shimpe/scdeken/cmd/scdeken@$(cat .scdeken-version)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Look for new upstream versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scdeken index new-versions --recipes recipes > "$RUNNER_TEMP/new-versions.json"
      - name: Open one pull request per new version
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main

          # Opens the pull request for one proposal (a JSON object). A failure
          # leaves no branch behind, so the next run tries again.
          propose() {
            local package version commit compare branch
            package="$(jq -r .package <<< "$1")"
            version="$(jq -r .version <<< "$1")"
            commit="$(jq -r .commit <<< "$1")"
            compare="$(jq -r '.compare_url // ""' <<< "$1")"
            branch="bot/$package-$version"
            git check-ref-format "refs/heads/$branch" || { echo "unusable branch name"; return 1; }

            if [ "$(gh pr list --state all --head "$branch" --json number --jq length)" != "0" ]; then
              echo "$branch already has a pull request"
              return 0
            fi
            # A branch without a pull request is left over from a failed run.
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              git push --quiet origin --delete "$branch" || return 1
            fi

            git switch --quiet --force-create "$branch" origin/main || return 1
            scdeken recipe approve "recipes/$package.toml" "$version" "$commit" || return 1
            git commit --quiet -am "approve $package $version" || return 1
            git push --quiet origin "$branch" || return 1
            {
              echo "Upstream has a new version of **$package**: \`$version\` (commit \`$commit\`)."
              echo
              if [ -n "$compare" ]; then echo "Review the changes: $compare"; echo; fi
              echo "Merging this approves the version; CI then builds and publishes it."
            } > "$RUNNER_TEMP/body.md"
            if ! gh pr create --base main --head "$branch" \
              --title "Approve $package $version" --body-file "$RUNNER_TEMP/body.md"; then
              git push --quiet origin --delete "$branch"
              return 1
            fi
          }

          # Every proposal starts from a clean main, so a failed one leaves
          # nothing behind for the next.
          clean_main() {
            git switch --quiet --discard-changes --detach origin/main
            git clean --quiet -fd
          }

          failed=0
          while IFS= read -r row; do
            clean_main
            if ! propose "$row"; then
              echo "::warning::could not open a pull request for $(jq -r '"\(.package) \(.version)"' <<< "$row")"
              failed=1
            fi
          done < <(jq -c '.proposals[]' "$RUNNER_TEMP/new-versions.json")
          clean_main
          if [ "$failed" = 1 ]; then
            echo "::error::some proposals could not be opened (see the warnings); the next run tries them again"
            exit 1
          fi
      - name: Open an issue for each moved tag
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          while IFS= read -r row; do
            package="$(jq -r .package <<< "$row")"
            version="$(jq -r .version <<< "$row")"
            recorded="$(jq -r .recorded <<< "$row")"
            now="$(jq -r .now <<< "$row")"
            title="Moved tag: $package $version"
            if gh issue list --state open --limit 200 --json title --jq '.[].title' | grep -Fxq "$title"; then
              echo "an issue for \"$title\" is already open"
              continue
            fi
            {
              echo "The upstream tag for **$package $version** now points at a different commit."
              echo
              echo "- approved commit: \`$recorded\`"
              echo "- tag now points at: \`$now\`"
              echo
              echo "A moved tag can mean a rewritten release. Please look before approving anything else."
            } > "$RUNNER_TEMP/body.md"
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" ||
              echo "::warning::could not open the issue for $title"
          done < <(jq -c '.moved[]' "$RUNNER_TEMP/new-versions.json")
