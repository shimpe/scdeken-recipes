name: Publish

# When approved recipe versions reach main: build them everywhere, then create
# one release per package version holding the zips, the file lists and
# SHA256SUMS, and ask index.yml to republish the index. A platform whose build
# fails is left out of the release; the other platforms are still published.
# Run it by hand (recipe and version) to rebuild one version.

on:
  push:
    branches: [main]
    paths: ['recipes/**']
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe file to rebuild, e.g. recipes/fmx6.toml'
        required: true
      version:
        description: 'Approved version to rebuild, e.g. 0.1.0'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan builds
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_builds: ${{ steps.matrix.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install scdeken
        run: |
          go install "github.com/shimpe/scdeken/cmd/scdeken@$(cat .scdeken-version)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: List the versions to build
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # First push: every approved version is new. Compare with an empty commit.
            tree="$(git hash-object -t tree -w /dev/null)"
            BASE_SHA="$(GIT_AUTHOR_NAME=x GIT_AUTHOR_EMAIL=x@example.org GIT_COMMITTER_NAME=x GIT_COMMITTER_EMAIL=x@example.org git commit-tree "$tree" -m empty)"
          fi
          scdeken ci matrix --recipes recipes --base "$BASE_SHA" > rows.json
      - name: List the version to rebuild
        if: github.event_name == 'workflow_dispatch'
        env:
          RECIPE: ${{ inputs.recipe }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RECIPE" =~ ^recipes/[A-Za-z0-9._+-]+\.toml$ ]] || [ ! -f "$RECIPE" ]; then
            echo "::error::there is no recipe file $RECIPE"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || ! grep -Fq "\"$VERSION\" = " "$RECIPE"; then
            echo "::error::$VERSION is not an approved version in $RECIPE"
            exit 1
          fi
          package="$(sed -n 's/^name = "\(.*\)"$/\1/p' "$RECIPE")"
          jq -n --arg recipe "$RECIPE" --arg package "$package" --arg version "$VERSION" \
            '[{recipe: $recipe, package: $package, version: $version}]' > rows.json
      - name: Plan builds
        id: matrix
        run: |
          scdeken ci platforms > platforms.json
          # Quark-only recipes have no [build] table and nothing to compile.
          for recipe in $(jq -r '.[].recipe' rows.json | sort -u); do
            if grep -q '^\[build' "$recipe"; then echo "$recipe"; fi
          done | jq -R . | jq -s . > buildable.json
          jq -c --slurpfile platforms platforms.json --slurpfile buildable buildable.json '
            {include: [ .[] | select(.recipe as $r | $buildable[0] | any(. == $r)) as $row
              | $platforms[0][]
              | {recipe: $row.recipe, package: $row.package, version: $row.version,
                 runner, key_os, arch, build_arch,
                 key: (.key_os + "-" + .arch + "-api3")} ]}' rows.json > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "has_builds=$(jq '.include | length > 0' matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.package }} ${{ matrix.version }} (${{ matrix.key }})
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install scdeken
        run: |
          go install "github.com/shimpe/scdeken/cmd/scdeken@$(cat .scdeken-version)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Does the recipe need libraries?
        id: requires
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          if grep -q '^\[requires' "$RECIPE"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up vcpkg
        if: steps.requires.outputs.needed == 'true'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "$(cygpath -w "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Build and pack
        id: build
        # A platform that fails must not keep the others from being published.
        continue-on-error: true
        env:
          RECIPE: ${{ matrix.recipe }}
          VERSION: ${{ matrix.version }}
          KEY: ${{ matrix.key }}
          BUILD_ARCH: ${{ matrix.build_arch }}
          NEEDS_VCPKG: ${{ steps.requires.outputs.needed }}
        run: |
          out="$RUNNER_TEMP/out/$KEY"
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/stage"
          args=(--recipe "$RECIPE" --version "$VERSION" --out "$out")
          if [ -n "$BUILD_ARCH" ]; then args+=(--arch "$BUILD_ARCH"); fi
          if [ "$NEEDS_VCPKG" = "true" ]; then args+=(--vcpkg-root "$RUNNER_TEMP/vcpkg"); fi
          scdeken build "${args[@]}"
          scdeken ci pack "$out" "$RUNNER_TEMP/stage/$KEY.zip"
          cp "$out.files.txt" "$RUNNER_TEMP/stage/$KEY.files.txt"
      - name: Record the outcome
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          KEY: ${{ matrix.key }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mark="❌ not published"; if [ "$OUTCOME" = "success" ]; then mark="✅ built"; fi
          echo "$mark: **$PACKAGE $VERSION** on \`$KEY\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: build-${{ matrix.package }}-${{ matrix.version }}-${{ matrix.key }}
          path: ${{ runner.temp }}/stage
      # The leg shows red; the release job only takes artifacts of legs that succeeded.
      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  release:
    name: create releases and refresh the index
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    needs: [plan, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
      # The build legs run upstream code with this run's artifact token, so one
      # leg could upload an artifact under another leg's name. Only artifacts
      # named after a planned leg whose job succeeded, holding exactly that
      # leg's zip and file list, are published.
      - name: Check where each build came from
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "success") | .name' > succeeded.txt
          mkdir -p accepted
          while read -r package version key; do
            leg="build-$package-$version-$key"
            if ! grep -Fxq "build $package $version ($key)" succeeded.txt; then
              echo "::warning::$package $version was not built for $key, so that platform is not published"
              continue
            fi
            if [ "$(ls -A "artifacts/$leg" 2>/dev/null | sort | tr '\n' ' ')" != "$key.files.txt $key.zip " ]; then
              echo "::error::$leg does not hold exactly $key.zip and $key.files.txt, so it is not published"
              continue
            fi
            mkdir -p "accepted/$package-$version"
            cp "artifacts/$leg/$key.zip" "artifacts/$leg/$key.files.txt" "accepted/$package-$version/"
          done < <(printf '%s' "$MATRIX" | jq -r '.include[] | "\(.package) \(.version) \(.key)"')
          printf '%s' "$MATRIX" | jq -r '.include[] | "\(.package)-\(.version)"' | sort -u |
            while read -r tag; do
              if [ ! -d "accepted/$tag" ]; then
                echo "::warning::$tag was not built on any platform, so it gets no release"
              fi
            done
      - name: Create or update one release per package version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          # A rebuild of some platforms keeps the checksums of the others.
          keep_other_sums() { # tag dir
            local old="$RUNNER_TEMP/sums-$1"
            gh release download "$1" --pattern SHA256SUMS --dir "$old" || return 0
            while read -r sum name; do
              [ -e "$2/$name" ] || echo "$sum  $name" >> "$2/SHA256SUMS"
            done < "$old/SHA256SUMS"
          }
          for dir in accepted/*/; do
            [ -d "$dir" ] || continue
            tag="$(basename "$dir")"
            (cd "$dir" && sha256sum -- *.zip > SHA256SUMS)
            if gh release view "$tag" > /dev/null 2>&1; then
              keep_other_sums "$tag" "$dir"
              gh release upload "$tag" "$dir"* --clobber
            else
              gh release create "$tag" "$dir"* --target "$TARGET" \
                --title "$tag" --notes "Prebuilt binaries of $tag, built by CI."
            fi
          done
      - name: Refresh the index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run index.yml
