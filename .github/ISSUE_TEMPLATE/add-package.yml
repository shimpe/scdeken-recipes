name: Add a package
description: Ask for a SuperCollider plugin or quark to be added to sc-deken.
title: "Add a package: "
labels: ["add-package"]
body:
  - type: input
    id: repo_url
    attributes:
      label: GitHub URL of the plugin or quark
      description: "For example https://github.com/someone/their-plugin"
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything the maintainers should know (optional).
    validations:
      required: false
